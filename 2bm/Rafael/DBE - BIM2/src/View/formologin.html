<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap");

      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(
          135deg,
          #667eea 0%,
          #764ba2 50%,
          #f093fb 100%
        );
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      h1 {
        position: absolute;
        top: 30px;
        color: white;
        font-size: 2.5em;
        text-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        letter-spacing: 2px;
      }

      .errors {
        position: fixed;
        top: 20px;
        right: 20px;
        max-width: 400px;
        z-index: 1000;
      }

      .error-msg {
        background: #c0392b;
        color: #ffffff;
        padding: 15px 20px;
        border-radius: 10px;
        margin-bottom: 10px;
        box-shadow: 0 5px 20px rgba(192, 57, 43, 0.4);
        animation: slideIn 0.3s ease-out;
      }

      @keyframes slideIn {
        from {
          transform: translateX(500px);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      form {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        padding: 50px 40px;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 450px;
        border: 2px solid rgba(255, 255, 255, 0.5);
        animation: fadeInUp 0.6s ease-out;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 1.05em;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #4c51bf;
      }

      input {
        width: 100%;
        padding: 14px 16px;
        margin-bottom: 25px;
        border: 2px solid #e0e0e0;
        border-radius: 12px;
        font-size: 1em;
        font-family: "Poppins", sans-serif;
        transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        background: #f8f9fa;
      }

      input:focus {
        outline: none;
        border-color: #667eea;
        background: white;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        transform: translateY(-2px);
      }

      input::placeholder {
        color: #999;
      }

      button {
        width: 100%;
        padding: 14px;
        margin-top: 10px;
        margin-bottom: 15px;
        border: none;
        border-radius: 12px;
        font-size: 1.05em;
        font-weight: 600;
        font-family: "Poppins", sans-serif;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      button[type="submit"] {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #ffffff;
        box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
      }

      button[type="submit"]:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
      }

      button[type="submit"]:active {
        transform: translateY(0);
      }

      button[type="reset"] {
        background: #f0f0f0;
        color: #333;
        border: 2px solid #e0e0e0;
      }

      button[type="reset"]:hover {
        background: #e8e8e8;
        border-color: #d0d0d0;
      }

      @media (max-width: 600px) {
        h1 {
          font-size: 1.8em;
          top: 20px;
        }

        form {
          padding: 40px 25px;
          margin-top: 80px;
        }

        label {
          font-size: 0.95em;
        }

        input {
          padding: 12px 14px;
          font-size: 16px;
          margin-bottom: 20px;
        }

        button {
          padding: 12px;
          font-size: 1em;
        }

        .errors {
          top: 10px;
          right: 10px;
          left: 10px;
          max-width: none;
        }

        .error-msg {
          padding: 12px 15px;
        }
      }

      @media (max-width: 480px) {
        h1 {
          font-size: 1.5em;
        }

        form {
          padding: 30px 20px;
          margin-top: 70px;
        }

        label {
          font-size: 0.9em;
          margin-bottom: 6px;
        }

        input {
          padding: 11px 12px;
          margin-bottom: 18px;
        }
      }
    </style>
  </head>
  <body>
    <h1>Login</h1>

    <div class="errors"></div>

    <form id="frm" action="" method="post">
      <label for="email">Email:</label>
      <input
        type="email"
        name="email"
        id="email"
        placeholder="xxx@gmail.com"
        required
      />
      <br /><br />

      <label for="senha">Senha:</label>
      <input type="password" name="senha" id="senha" required />
      <br /><br />

      <button type="submit">Enviar</button>
      <br /><br />

      <button type="reset">Limpar</button>
    </form>

    <script src="login.js"></script>
  </body>
</html>
