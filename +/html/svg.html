<!doctype html>
<html lang="pt-br">
  <head>
    <!-- Configuração de codificação da página -->
    <meta charset="UTF-8" />
    <!-- Título da página -->
    <title>Svg</title>
  </head>
  <body>
    <!-- Título principal -->
    <h1>SVG</h1>

    <!-- Desenha um círculo com SVG (gráficos vetoriais escaláveis) -->
    <!-- Círculo com centro em (50,50), raio de 40px, borda verde e preenchimento amarelo -->
    <svg width="100" height="100">
      <circle
        cx="50"
        cy="50"
        r="40"
        stroke="green"
        stroke-width="4"
        fill="yellow"
      />
    </svg>
  </body>
</html>
