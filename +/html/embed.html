<!doctype html>
<html lang="pt-br">
  <head>
    <!-- Configuração de codificação da página -->
    <meta charset="UTF-8" />
    <!-- Título da página -->
    <title>Embed</title>
  </head>
  <body>
    <!-- Título principal -->
    <h1>Embed</h1>

    <!-- Incorpora um vídeo MP4 usando a tag embed (método antigo) -->
    <embed
      src="videos/gojos (1).mp4"
      type="video/mp4"
      width="1366"
      height="768"
    />

    <!-- Incorpora um vídeo MP4 com controles de reprodução (método moderno) -->
    <video
      controls
      src="videos/gojos (2).mp4"
      type="video/mp4"
      width="300px"
    ></video>
  </body>
</html>
