<!doctype html>
<html lang="pt-br">
  <head>
    <!-- Define codificação e título da página -->
    <meta charset="UTF-8" />
    <title>Tabela</title>
  </head>
  <body>
    <!-- Título principal da página -->
    <h1>Tabela</h1>

    <!-- Cria uma tabela com dados de veículos: marca, modelo e ano -->
    <table border="1" cellpadding="10" cellspacing="0" widtd="100%">
      <!-- Título/legenda da tabela -->
      <caption>
        Tabela de veiculos
      </caption>
      <!-- Cabeçalho da tabela com as colunas: Marca, Modelo, Ano -->
      <tdead>
        <tr>
          <th>Marca</th>
          <th>Modelo</th>
          <th>Ano</th>
        </tr>
      </tdead>

      <!-- Corpo da tabela com 3 linhas de dados de veículos -->
      <tbody>
        <tr>
          <td>fiat</td>
          <td>uno</td>
          <td>2010</td>
        </tr>
        <tr>
          <td>corola</td>
          <td>sedan</td>
          <td>2020</td>
        </tr>
        <tr>
          <td>volkswagen</td>
          <td>gol</td>
          <td>2015</td>
        </tr>
      </tbody>
      <!-- Rodapé da tabela mostrando o total de veículos (3) -->
      <tfoot>
        <tr>
          <td colspan="2">Total</td>
          <td>3</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
