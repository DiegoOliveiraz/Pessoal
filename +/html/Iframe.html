<!doctype html>
<html lang="pt-br">
  <head>
    <!-- Configuração de codificação da página -->
    <meta charset="UTF-8" />
    <!-- Título da página -->
    <title>Iframe</title>
  </head>
  <body>
    <!-- Título principal -->
    <h1>Iframe</h1>

    <!-- Incorpora um vídeo do YouTube em um iframe (quadro embarcado) -->
    <!-- Permite reprodução, zoom de pintura e outras funcionalidades do YouTube -->
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/YPgC4ujU7Kg?si=dhndkoQVayggK8Gi"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
  </body>
</html>
