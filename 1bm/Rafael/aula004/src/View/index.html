<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>teste de acesso</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Inter:wght@400;500;600&display=swap");

      body {
        font-family: "Poppins", "Segoe UI", sans-serif;
        background: linear-gradient(
          135deg,
          #667eea 0%,
          #764ba2 50%,
          #f093fb 100%
        );
        background-attachment: fixed;
        min-height: 100vh;
        padding: 60px 20px;
        position: relative;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(
            circle at 20% 50%,
            rgba(255, 255, 255, 0.1) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 80%,
            rgba(255, 255, 255, 0.05) 0%,
            transparent 50%
          );
        pointer-events: none;
        z-index: 0;
      }

      h1 {
        text-align: center;
        color: white;
        font-size: 3.5em;
        margin-bottom: 80px;
        text-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        letter-spacing: 3px;
        font-weight: 800;
        position: relative;
        z-index: 1;
        animation: fadeInDown 0.8s ease-out;
      }

      @keyframes fadeInDown {
        from {
          opacity: 0;
          transform: translateY(-30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .Jogos {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 40px;
        max-width: 1400px;
        margin: 0 auto;
        position: relative;
        z-index: 1;
      }

      .jogo {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 35px;
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.25),
          0 0 40px rgba(102, 126, 234, 0.1);
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        border: 2px solid rgba(255, 255, 255, 0.5);
        overflow: hidden;
        position: relative;
      }

      .jogo::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
        transition: left 0.5s ease;
      }

      .jogo:hover::before {
        left: 100%;
      }

      .jogo::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 5px;
        background: linear-gradient(
          90deg,
          #667eea 0%,
          #764ba2 50%,
          #f093fb 100%
        );
      }

      .jogo:hover {
        transform: translateY(-15px) scale(1.02);
        box-shadow:
          0 35px 80px rgba(0, 0, 0, 0.35),
          0 0 60px rgba(102, 126, 234, 0.2);
        border-color: rgba(102, 126, 234, 0.5);
      }

      .linha {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 25px;
        padding-bottom: 20px;
        border-bottom: 2px solid #f0f0f0;
        animation: slideInUp 0.6s ease-out;
      }

      .linha:last-child {
        margin-bottom: 0;
        padding-bottom: 0;
        border-bottom: none;
      }

      @keyframes slideInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .label {
        font-weight: 700;
        font-family: "Inter", sans-serif;
        color: #5a67d8;
        min-width: 100px;
        font-size: 0.95em;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .content {
        color: #2a2a2a;
        font-size: 1.05em;
        font-weight: 500;
        flex: 1;
        padding: 12px 18px;
        background: linear-gradient(135deg, #f8f9fa 0%, #f0f0f5 100%);
        border-radius: 12px;
        border-left: 4px solid #667eea;
        transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        position: relative;
      }

      .jogo:hover .content {
        background: linear-gradient(135deg, #e8f0ff 0%, #f0e8ff 100%);
        color: #4c51bf;
        transform: translateX(8px);
        box-shadow: 0 5px 20px rgba(102, 126, 234, 0.15);
      }

      /* Responsivo */
      @media (max-width: 768px) {
        h1 {
          font-size: 2.5em;
          margin-bottom: 50px;
          letter-spacing: 2px;
        }

        .Jogos {
          grid-template-columns: 1fr;
          gap: 25px;
        }

        .jogo {
          padding: 25px;
        }

        .label {
          min-width: 90px;
          font-size: 0.9em;
        }

        body {
          padding: 40px 15px;
        }
      }

      @media (max-width: 480px) {
        h1 {
          font-size: 1.8em;
          margin-bottom: 40px;
          letter-spacing: 1px;
        }

        .linha {
          flex-direction: column;
          align-items: flex-start;
          gap: 10px;
          margin-bottom: 15px;
          padding-bottom: 15px;
        }

        .label {
          width: 100%;
          min-width: 100%;
        }

        .content {
          width: 100%;
        }

        .jogo {
          padding: 20px;
        }

        body {
          padding: 30px 10px;
        }
      }
    </style>
  </head>
  <body>
    <h1>Jogos</h1>
    <section class="Jogos">
      
    </section>
  </body>
  <script src="script.js"></script>
</html>
